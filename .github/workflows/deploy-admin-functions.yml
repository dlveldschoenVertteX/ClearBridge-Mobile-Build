name: Deploy Admin Panel Functions

# Manually triggered only -- deploys the nodejs-functions codebase
# (functions/index.js: bootstrapFirstAdmin, the admin panel's first-launch
# account bootstrap), same "backend deploys never fire automatically on
# push" discipline as deploy-functions.yml's own Python pipeline deploy.
#
# NOTE: workflow_dispatch can only be triggered via the GitHub API/UI once
# this file exists on the repo's default branch -- until then, run it via
# the Actions tab's "Run workflow" button after merging, or trigger from a
# branch that already has it merged in (same caveat deploy-functions.yml
# already documents for itself).
on:
  workflow_dispatch: {}

jobs:
  deploy-nodejs-functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Real failure found 2026-08-23 (first-ever run of this workflow):
      # firebase-tools' own codebase-analysis step (which runs locally
      # before handing off to Cloud Build) needs `functions/node_modules`
      # on disk to introspect the `firebase-functions` package -- it does
      # not run `npm install` itself. Without this: "Couldn't find
      # firebase-functions package in your source code... Error: An
      # unexpected error has occurred." Same class of gap already
      # documented for deploy-functions.yml's own Python venv step, just
      # the Node.js equivalent.
      - name: Install functions dependencies
        working-directory: functions
        run: npm install

      # Real finding 2026-08-23 (second run): the live project's
      # nodejs-functions codebase already runs 18 real production
      # functions this repo has no source for (paystackWebhook,
      # generateOTP/verifyOTP, deleteBiometricData, deleteUserAccount,
      # generateCertificate, creditReferrer, autoClearanceProcessor, the
      # beta capture reminders, etc.) -- `--only functions:nodejs-functions`
      # treats the WHOLE codebase as authoritative and correctly refused,
      # in non-interactive mode, to silently delete all of them. Do not
      # add --force here -- that would delete live payment/OTP/
      # certificate/account-deletion functions. Scoped to the one new
      # function by name instead, which only creates/updates that
      # function and can never touch (or propose deleting) any other
      # function in the same codebase.
      - name: Deploy bootstrapFirstAdmin to Firebase
        env:
          FIREBASE_SA_KEY: ${{ secrets.FIREBASE_SA_KEY }}
        run: |
          echo "$FIREBASE_SA_KEY" > /tmp/sa.json
          npm install -g firebase-tools --quiet
          GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa.json \
            firebase deploy --only functions:nodejs-functions:bootstrapFirstAdmin \
              --project clearbridge-dc699 \
              --non-interactive
          rm /tmp/sa.json
