name: Deploy Python Pipeline Function

# Manually triggered only -- this deploys the production
# processEnhanceAndScore Cloud Function (africa-south1) and must never fire
# automatically on push, unlike the APK/hosting jobs in build.yml.
#
# NOTE: workflow_dispatch can only be triggered via the GitHub API/UI once
# this file exists on the repo's default branch -- until then, run it via
# the Actions tab's "Run workflow" button after merging, or trigger from a
# branch that already has it merged in.
on:
  workflow_dispatch: {}

jobs:
  deploy-python-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy processEnhanceAndScore to Firebase
        env:
          FIREBASE_SA_KEY: ${{ secrets.FIREBASE_SA_KEY }}
        run: |
          echo "$FIREBASE_SA_KEY" > /tmp/sa.json
          npm install -g firebase-tools --quiet
          GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa.json \
            firebase deploy --only functions:python-pipeline \
              --project clearbridge-dc699 \
              --non-interactive
          rm /tmp/sa.json
