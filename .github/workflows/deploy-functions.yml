name: Deploy Python Pipeline Function

# Manually triggered only -- this deploys the production
# processEnhanceAndScore Cloud Function (africa-south1) and must never fire
# automatically on push, unlike the APK/hosting jobs in build.yml.
#
# NOTE: workflow_dispatch can only be triggered via the GitHub API/UI once
# this file exists on the repo's default branch -- until then, run it via
# the Actions tab's "Run workflow" button after merging, or trigger from a
# branch that already has it merged in.
on:
  workflow_dispatch: {}

jobs:
  deploy-python-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Real failure found 2026-08-03 (first-ever run of this workflow that
      # got this far): firebase-tools' Python-functions codebase analysis
      # runs locally (before handing off to Cloud Build) and needs a venv
      # on disk to introspect the firebase-functions SDK -- it does not
      # create one itself. Without this step: "Error: Failed to find
      # location of Firebase Functions SDK: Missing virtual environment at
      # venv directory." firebase.json already excludes venv/** from the
      # actual uploaded source (Cloud Build installs requirements.txt
      # itself), so this venv exists purely for the local CLI's own
      # pre-flight analysis step.
      - name: Create venv for Firebase Functions Python SDK detection
        working-directory: functions/processEnhanceAndScore
        run: |
          python3.11 -m venv venv
          venv/bin/pip install --quiet --upgrade pip
          venv/bin/pip install --quiet -r requirements.txt

      - name: Deploy processEnhanceAndScore to Firebase
        env:
          FIREBASE_SA_KEY: ${{ secrets.FIREBASE_SA_KEY }}
        run: |
          echo "$FIREBASE_SA_KEY" > /tmp/sa.json
          npm install -g firebase-tools --quiet
          GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa.json \
            firebase deploy --only functions:python-pipeline \
              --project clearbridge-dc699 \
              --non-interactive
          rm /tmp/sa.json
