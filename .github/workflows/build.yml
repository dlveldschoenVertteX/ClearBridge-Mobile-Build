  build-clearbridge-beta:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    # Standalone consumer-facing beta build (clearbridge_beta/) -- single-pass
    # front-only capture, no arc-sweep or four-angle code at all, decoupled
    # from both the main app and capture_harness so none of the three need
    # to change in lockstep.
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-beta-${{ runner.os }}-${{ hashFiles('clearbridge_beta/android/**/*.gradle*', 'clearbridge_beta/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-beta-${{ runner.os }}-

      - run: flutter pub get
        working-directory: clearbridge_beta

      # Static analysis BEFORE the expensive Gradle build (added 2026-08-20,
      # full-codebase audit). This repo had no analysis and no tests in CI at
      # all, so the first signal for even a hard compile error was a ~3min
      # Gradle failure -- exactly how the real
      # `CameraExtensionCharacteristics.EXTENSION_MACRO` breakage surfaced on
      # 2026-08-20 (that reference does not exist in the Android SDK; analyze
      # reports it in seconds). Placed before `flutter build` so a broken
      # commit fails fast and burns far fewer CI minutes, which this project
      # actively budgets for.
      #
      # Deliberately errors-only (--no-fatal-warnings --no-fatal-infos): the
      # goal is catching real breakage without a backlog of pre-existing style
      # lints blocking every build on day one. Tighten later once the warning
      # backlog is triaged.
      - name: Analyze (clearbridge_beta)
        run: flutter analyze --no-fatal-warnings --no-fatal-infos
        working-directory: clearbridge_beta

      - name: Decode keystore
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > /tmp/release.keystore

      - run: flutter build apk --release --target-platform android-arm64
        working-directory: clearbridge_beta
        env:
          KEYSTORE_PATH: /tmp/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Delete old beta artifact to free storage quota
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/${{ github.repository }}/actions/artifacts" --paginate \
            --jq '.artifacts[] | select(.name == "clearbridge-beta-apk" and .expired == false) | .id' \
            2>/dev/null | while read id; do
            gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$id" || true
          done

      - uses: actions/upload-artifact@v4
        # See the "build" job's four-angle upload-artifact step for why this
        # is best-effort: it's not a dependency of the publish steps below.
        continue-on-error: true
        with:
          name: clearbridge-beta-apk
          path: clearbridge_beta/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7

      - name: Publish beta APK to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest-clearbridge-beta-apk --yes 2>/dev/null || true
          git push --delete origin latest-clearbridge-beta-apk 2>/dev/null || true
          gh release create latest-clearbridge-beta-apk \
            --title "Latest ClearBridge Beta APK (build ${{ github.run_number }})" \
            --notes "Commit: ${{ github.sha }}" \
            "clearbridge_beta/build/app/outputs/flutter-apk/app-release.apk#clearbridge-beta.apk"
          echo "Beta: https://github.com/${{ github.repository }}/releases/download/latest-clearbridge-beta-apk/clearbridge-beta.apk"

      - name: Upload beta APK to Firebase Storage
        env:
          FIREBASE_SA_KEY: ${{ secrets.FIREBASE_SA_KEY }}
        run: |
          pip install google-auth requests --quiet
          python3 - <<'PYEOF'
          import json, os, requests, google.auth.transport.requests as gtr
          from google.oauth2 import service_account

          sa = json.loads(os.environ['FIREBASE_SA_KEY'])
          creds = service_account.Credentials.from_service_account_info(
              sa, scopes=['https://www.googleapis.com/auth/cloud-platform'])
          creds.refresh(gtr.Request())
          token = creds.token
          bucket = 'clearbridge-dc699.firebasestorage.app'
          name = 'clearbridge-beta-latest.apk'
          path = 'clearbridge_beta/build/app/outputs/flutter-apk/app-release.apk'

          with open(path, 'rb') as f:
            data = f.read()
          r = requests.post(
            f'https://storage.googleapis.com/upload/storage/v1/b/{bucket}/o'
            f'?uploadType=media&name=apk-builds/{name}&predefinedAcl=publicRead',
            headers={'Authorization': f'Bearer {token}',
                     'Content-Type': 'application/vnd.android.package-archive'},
            data=data, timeout=120)
          if r.status_code in (200, 201):
            print(f'✓ Download: https://storage.googleapis.com/{bucket}/apk-builds/{name}')
          else:
            print(f'✗ Upload failed: {r.status_code} {r.text[:100]}')
