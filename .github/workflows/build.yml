name: Flutter Build

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - run: flutter pub get

      - name: Build four-angle APK
        run: flutter build apk --release --target-platform android-arm64 --flavor fourAngle --dart-define=CAPTURE_MODE=fourAngle

      - name: Build arc-sweep APK
        run: flutter build apk --release --target-platform android-arm64 --flavor arcSweep --dart-define=CAPTURE_MODE=arcSweep

      - uses: actions/upload-artifact@v4
        # Best-effort: the CI-downloadable artifact is a convenience, not a
        # dependency of the publish steps below (they read the APK straight
        # off disk). Storage-quota exhaustion here must not block the
        # GitHub Release / Firebase Storage publish, which is what users
        # actually download from.
        continue-on-error: true
        with:
          name: flutter-apk-four-angle
          # Gradle lowercases the flavor name in the output filename
          # regardless of how it's declared in build.gradle.kts.
          path: build/app/outputs/flutter-apk/app-fourangle-release.apk

      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: flutter-apk-arc-sweep
          path: build/app/outputs/flutter-apk/app-arcsweep-release.apk

      - name: Publish APKs to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest-apk --yes 2>/dev/null || true
          git push --delete origin latest-apk 2>/dev/null || true
          gh release create latest-apk \
            --title "Latest APKs (build ${{ github.run_number }})" \
            --notes "Commit: ${{ github.sha }}" \
            "build/app/outputs/flutter-apk/app-fourangle-release.apk#clearbridge-four-angle.apk" \
            "build/app/outputs/flutter-apk/app-arcsweep-release.apk#clearbridge-arc-sweep.apk"
          echo "Four-angle: https://github.com/${{ github.repository }}/releases/download/latest-apk/clearbridge-four-angle.apk"
          echo "Arc-sweep:  https://github.com/${{ github.repository }}/releases/download/latest-apk/clearbridge-arc-sweep.apk"

      - name: Upload APKs to Firebase Storage
        env:
          FIREBASE_SA_KEY: ${{ secrets.FIREBASE_SA_KEY }}
        run: |
          pip install google-auth requests --quiet
          python3 - <<'PYEOF'
          import json, os, requests, google.auth.transport.requests as gtr
          from google.oauth2 import service_account

          sa = json.loads(os.environ['FIREBASE_SA_KEY'])
          creds = service_account.Credentials.from_service_account_info(
              sa, scopes=['https://www.googleapis.com/auth/cloud-platform'])
          creds.refresh(gtr.Request())
          token = creds.token
          bucket = 'clearbridge-dc699.firebasestorage.app'

          apks = {
            'clearbridge-four-angle-latest.apk':
              'build/app/outputs/flutter-apk/app-fourangle-release.apk',
            'clearbridge-arc-sweep-latest.apk':
              'build/app/outputs/flutter-apk/app-arcsweep-release.apk',
          }
          for name, path in apks.items():
            with open(path, 'rb') as f:
              data = f.read()
            r = requests.post(
              f'https://storage.googleapis.com/upload/storage/v1/b/{bucket}/o'
              f'?uploadType=media&name=apk-builds/{name}&predefinedAcl=publicRead',
              headers={'Authorization': f'Bearer {token}',
                       'Content-Type': 'application/vnd.android.package-archive'},
              data=data, timeout=120)
            if r.status_code in (200, 201):
              url = f'https://storage.googleapis.com/{bucket}/apk-builds/{name}'
              print(f'✓ {name}: {url}')
            else:
              print(f'✗ {name}: {r.status_code} {r.text[:100]}')
          PYEOF

  build-capture-harness:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Standalone camera-only test build (capture_harness/) -- depends only on
    # the mac_capture package, no Firebase/Paystack/MLKit/dashboard, so it's
    # a small APK for testing just the MAC3D capture flow.
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-harness-${{ runner.os }}-${{ hashFiles('capture_harness/android/**/*.gradle*', 'capture_harness/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-harness-${{ runner.os }}-

      - run: flutter pub get
        working-directory: capture_harness

      - run: flutter build apk --release --target-platform android-arm64
        working-directory: capture_harness

      - uses: actions/upload-artifact@v4
        # See the "build" job's four-angle upload-artifact step for why this
        # is best-effort: it's not a dependency of the publish steps below.
        continue-on-error: true
        with:
          name: capture-harness-apk
          path: capture_harness/build/app/outputs/flutter-apk/app-release.apk

      - name: Publish harness APK to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest-harness-apk --yes 2>/dev/null || true
          git push --delete origin latest-harness-apk 2>/dev/null || true
          gh release create latest-harness-apk \
            --title "Latest Harness APK (build ${{ github.run_number }})" \
            --notes "Commit: ${{ github.sha }}" \
            "capture_harness/build/app/outputs/flutter-apk/app-release.apk#clearbridge-harness.apk"
          echo "Harness: https://github.com/${{ github.repository }}/releases/download/latest-harness-apk/clearbridge-harness.apk"

      - name: Upload harness APK to Firebase Storage
        env:
          FIREBASE_SA_KEY: ${{ secrets.FIREBASE_SA_KEY }}
        run: |
          pip install google-auth requests --quiet
          python3 - <<'PYEOF'
          import json, os, requests, google.auth.transport.requests as gtr
          from google.oauth2 import service_account

          sa = json.loads(os.environ['FIREBASE_SA_KEY'])
          creds = service_account.Credentials.from_service_account_info(
              sa, scopes=['https://www.googleapis.com/auth/cloud-platform'])
          creds.refresh(gtr.Request())
          token = creds.token
          bucket = 'clearbridge-dc699.firebasestorage.app'
          name = 'clearbridge-harness-latest.apk'
          path = 'capture_harness/build/app/outputs/flutter-apk/app-release.apk'

          with open(path, 'rb') as f:
            data = f.read()
          r = requests.post(
            f'https://storage.googleapis.com/upload/storage/v1/b/{bucket}/o'
            f'?uploadType=media&name=apk-builds/{name}&predefinedAcl=publicRead',
            headers={'Authorization': f'Bearer {token}',
                     'Content-Type': 'application/vnd.android.package-archive'},
            data=data, timeout=120)
          if r.status_code in (200, 201):
            print(f'✓ Download: https://storage.googleapis.com/{bucket}/apk-builds/{name}')
          else:
            print(f'✗ Upload failed: {r.status_code} {r.text[:100]}')
          PYEOF

  build-clearbridge-beta:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Standalone consumer-facing beta build (clearbridge_beta/) -- single-pass
    # front-only capture, no arc-sweep or four-angle code at all, decoupled
    # from both the main app and capture_harness so none of the three need
    # to change in lockstep.
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-beta-${{ runner.os }}-${{ hashFiles('clearbridge_beta/android/**/*.gradle*', 'clearbridge_beta/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-beta-${{ runner.os }}-

      - run: flutter pub get
        working-directory: clearbridge_beta

      - name: Decode keystore
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > /tmp/release.keystore

      - run: flutter build apk --release --split-per-abi
        working-directory: clearbridge_beta
        env:
          KEYSTORE_PATH: /tmp/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - uses: actions/upload-artifact@v4
        # See the "build" job's four-angle upload-artifact step for why this
        # is best-effort: it's not a dependency of the publish steps below.
        continue-on-error: true
        with:
          name: clearbridge-beta-apk
          path: clearbridge_beta/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk

      - name: Publish beta APK to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest-clearbridge-beta-apk --yes 2>/dev/null || true
          git push --delete origin latest-clearbridge-beta-apk 2>/dev/null || true
          gh release create latest-clearbridge-beta-apk \
            --title "Latest ClearBridge Beta APK (build ${{ github.run_number }})" \
            --notes "Commit: ${{ github.sha }}" \
            "clearbridge_beta/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk#clearbridge-beta.apk"
          echo "Beta: https://github.com/${{ github.repository }}/releases/download/latest-clearbridge-beta-apk/clearbridge-beta.apk"

      - name: Upload beta APK to Firebase Storage
        env:
          FIREBASE_SA_KEY: ${{ secrets.FIREBASE_SA_KEY }}
        run: |
          pip install google-auth requests --quiet
          python3 - <<'PYEOF'
          import json, os, requests, google.auth.transport.requests as gtr
          from google.oauth2 import service_account

          sa = json.loads(os.environ['FIREBASE_SA_KEY'])
          creds = service_account.Credentials.from_service_account_info(
              sa, scopes=['https://www.googleapis.com/auth/cloud-platform'])
          creds.refresh(gtr.Request())
          token = creds.token
          bucket = 'clearbridge-dc699.firebasestorage.app'
          name = 'clearbridge-beta-latest.apk'
          path = 'clearbridge_beta/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk'

          with open(path, 'rb') as f:
            data = f.read()
          r = requests.post(
            f'https://storage.googleapis.com/upload/storage/v1/b/{bucket}/o'
            f'?uploadType=media&name=apk-builds/{name}&predefinedAcl=publicRead',
            headers={'Authorization': f'Bearer {token}',
                     'Content-Type': 'application/vnd.android.package-archive'},
            data=data, timeout=120)
          if r.status_code in (200, 201):
            print(f'✓ Download: https://storage.googleapis.com/{bucket}/apk-builds/{name}')
          else:
            print(f'✗ Upload failed: {r.status_code} {r.text[:100]}')
          PYEOF

  deploy-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy landing page to Firebase Hosting
        env:
          FIREBASE_SA_KEY: ${{ secrets.FIREBASE_SA_KEY }}
        run: |
          echo "$FIREBASE_SA_KEY" > /tmp/sa.json
          npm install -g firebase-tools --quiet
          GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa.json \
            firebase deploy --only hosting \
              --project clearbridge-dc699 \
              --non-interactive \
              --config firebase-hosting.json
          rm /tmp/sa.json
