name: Flutter Build

on: [push]

jobs:
  # NOTE: the four-angle + arc-sweep SfM capture flavors are discontinued
  # (2026-07-15) -- wider angular coverage dilutes ridge density in NFIQ's
  # fixed 500x500 model input rather than adding usable detail, so the CI
  # job that built them was removed. App code/flavors are left in place in
  # case reconstruction is revisited later; only the CI build was dropped.
  build-capture-harness:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    # Standalone camera-only test build (capture_harness/) -- depends only on
    # the mac_capture package, no Firebase/Paystack/MLKit/dashboard, so it's
    # a small APK for testing just the MAC3D capture flow.
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-harness-${{ runner.os }}-${{ hashFiles('capture_harness/android/**/*.gradle*', 'capture_harness/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-harness-${{ runner.os }}-

      - run: flutter pub get
        working-directory: capture_harness

      # Static analysis BEFORE the expensive Gradle build (added 2026-08-20,
      # full-codebase audit). This repo had no analysis and no tests in CI at
      # all, so the first signal for even a hard compile error was a ~3min
      # Gradle failure -- exactly how the real
      # `CameraExtensionCharacteristics.EXTENSION_MACRO` breakage surfaced on
      # 2026-08-20 (that reference does not exist in the Android SDK; analyze
      # reports it in seconds). Placed before `flutter build` so a broken
      # commit fails fast and burns far fewer CI minutes, which this project
      # actively budgets for.
      #
      # Deliberately errors-only (--no-fatal-warnings --no-fatal-infos): the
      # goal is catching real breakage without a backlog of pre-existing style
      # lints blocking every build on day one. Tighten later once the warning
      # backlog is triaged.
      - name: Analyze (capture_harness)
        run: flutter analyze --no-fatal-warnings --no-fatal-infos
        working-directory: capture_harness

      - run: flutter build apk --release --target-platform android-arm64
        working-directory: capture_harness

      - name: Delete old harness artifact to free storage quota
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/${{ github.repository }}/actions/artifacts" --paginate \
            --jq '.artifacts[] | select(.name == "capture-harness-apk" and .expired == false) | .id' \
            2>/dev/null | while read id; do
            gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$id" || true
          done

      - uses: actions/upload-artifact@v4
        # See the "build" job's four-angle upload-artifact step for why this
        # is best-effort: it's not a dependency of the publish steps below.
        continue-on-error: true
        with:
          name: capture-harness-apk
          path: capture_harness/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7

      - name: Publish harness APK to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest-harness-apk --yes 2>/dev/null || true
          git push --delete origin latest-harness-apk 2>/dev/null || true
          gh release create latest-harness-apk \
            --title "Latest Harness APK (build ${{ github.run_number }})" \
            --notes "Commit: ${{ github.sha }}" \
            "capture_harness/build/app/outputs/flutter-apk/app-release.apk#clearbridge-harness.apk"
          echo "Harness: https://github.com/${{ github.repository }}/releases/download/latest-harness-apk/clearbridge-harness.apk"

      - name: Upload harness APK to Firebase Storage
        env:
          FIREBASE_SA_KEY: ${{ secrets.FIREBASE_SA_KEY }}
        run: |
          pip install google-auth requests --quiet
          python3 - <<'PYEOF'
          import json, os, requests, google.auth.transport.requests as gtr
          from google.oauth2 import service_account

          sa = json.loads(os.environ['FIREBASE_SA_KEY'])
          creds = service_account.Credentials.from_service_account_info(
              sa, scopes=['https://www.googleapis.com/auth/cloud-platform'])
          creds.refresh(gtr.Request())
          token = creds.token
          bucket = 'clearbridge-dc699.firebasestorage.app'
          name = 'clearbridge-harness-latest.apk'
          path = 'capture_harness/build/app/outputs/flutter-apk/app-release.apk'

          with open(path, 'rb') as f:
            data = f.read()
          r = requests.post(
            f'https://storage.googleapis.com/upload/storage/v1/b/{bucket}/o'
            f'?uploadType=media&name=apk-builds/{name}&predefinedAcl=publicRead',
            headers={'Authorization': f'Bearer {token}',
                     'Content-Type': 'application/vnd.android.package-archive'},
            data=data, timeout=120)
          if r.status_code in (200, 201):
            print(f'✓ Download: https://storage.googleapis.com/{bucket}/apk-builds/{name}')
          else:
            print(f'✗ Upload failed: {r.status_code} {r.text[:100]}')
          PYEOF

