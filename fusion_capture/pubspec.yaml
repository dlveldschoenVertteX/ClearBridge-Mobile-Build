name: fusion_capture
description: >
  Standalone capture app for the FUSION architecture, isolated from
  clearbridge_beta / capture_harness / sweep_capture_test on purpose so it
  can be abandoned without touching anything that ships.

  Runs three capture phases in one session, each contributing INDEPENDENT
  whole-print candidates rather than pixels blended into a shared image:
    1. front  -- the proven V1 hold + 8-shot alternating ambient/flash burst
    2. tilt   -- small-angle (~10-12 deg) left / tip / right, each an
                 ambient+flash pair
    3. sweep  -- guide translated across zones, each an ambient+flash pair

  Phase 2 exists because it MEASURED positive: on real multi-angle data a
  tilted frame contributed 87-129 edge minutiae that a face-on capture never
  sees, against a face-on CONTROL frame's 4 (fusion_brain Phase 0b). The
  focus-zone bracket from clearbridge_beta is deliberately NOT included --
  it shares framing with the main burst and measured a median of 6 new
  minutiae, for ~15-18s of real capture time.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  mac_capture:
    path: ../packages/mac_capture
  path_provider: ^2.1.5
  uuid: ^4.5.3
  image: ^4.2.0
  # Upper-bounded to match every other app in this repo -- 4.12.0 broke
  # compile compat with the coordinated firebase_* bumps resolved alongside.
  firebase_core: '>=4.5.0 <4.12.0'
  firebase_auth: ^6.2.0
  cloud_firestore: ^6.1.3
  firebase_storage: ^13.1.0
  cloud_functions: ^6.0.7
  # NOTE: no sensors_plus entry here on purpose, same as sweep_capture_test.
  # mac_capture already pins ^4.0.2, so it's imported directly
  # (fusion_capture_controller.dart's gyro listener) as a TRANSITIVE
  # dependency with no entry of our own -- declaring a second, possibly
  # different constraint here is exactly what failed this app's first CI
  # run (^6.1.1 alongside mac_capture's ^4.0.2, unsatisfiable).

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  # thumb_orientation.tflite: the CV close-range presentation classifier
  # ported from the discontinued multi-angle architecture (round 41). Only
  # this one model, not hand_landmark_full.tflite -- that one is MediaPipe's
  # general landmark model, which the classifier was built specifically to
  # replace at close range (see thumb_orientation_classifier_io.dart's own
  # docstring). No new pub dependency needed: mac_capture already pins
  # tflite_flutter and already exports ThumbOrientationClassifier.
  assets:
    - assets/models/
