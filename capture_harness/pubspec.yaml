name: capture_harness
description: >
  Standalone camera-only test harness for the mac_capture package. Launches
  straight into MacCaptureScreen and pushes captures to the real ClearBridge
  Firebase backend (anonymous auth + Storage/Firestore/processEnhanceAndScore),
  so the MAC3D capture flow can be built and tested against the production
  pipeline in isolation from the full ClearBridge app (no Paystack, no MLKit,
  no dashboard, no login flow).
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  mac_capture:
    path: ../packages/mac_capture
  flutter_riverpod: ^2.6.1
  path_provider: ^2.1.5
  uuid: ^4.5.3
  firebase_core: ^4.5.0
  firebase_auth: ^6.2.0
  cloud_firestore: ^6.1.3
  firebase_storage: ^13.1.0
  cloud_functions: ^6.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/
