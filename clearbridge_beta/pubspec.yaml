name: clearbridge_beta
description: >
  Standalone "ClearBridge Beta" app: front-only single-pass MAC3D fingerprint
  capture for beta testers. Splash -> user details & POPIA consent -> front
  burst capture -> ClearCoin reward -> thank you. Anonymous Firebase auth
  against the real ClearBridge backend (Storage/Firestore/
  processEnhanceAndScore) -- no arc-sweep or four-angle capture code, no
  Paystack, no dashboard, no login flow. Deliberately decoupled from
  capture_harness and the main app so none of the three ever need to change
  in lockstep.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  mac_capture:
    path: ../packages/mac_capture
  path_provider: ^2.1.5
  uuid: ^4.5.3
  image: ^4.2.0
  google_fonts: ^6.2.1
  firebase_core: ^4.5.0
  firebase_auth: ^6.2.0
  cloud_firestore: ^6.1.3
  firebase_storage: ^13.1.0
  cloud_functions: ^6.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/
    - assets/audio/
    - assets/images/
